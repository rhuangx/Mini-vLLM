[project]
name = "mini-vllm"
version = "0.1.0"
description = "A paged-attention LLM inference engine for NVIDIA GPUs, on PyTorch and hand-written CUDA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.0",
    "torch>=2.11.0",
    "transformers>=5.0",
]

[dependency-groups]
dev = [
    "cmake>=3.27",
    "matplotlib>=3.9",
    "ninja>=1.11",
    # nvcc for src/extensions, CUDA 13 like torch. 13.2, not 13.0: glibc 2.42 declares rsqrt, which 13.0's headers clash with.
    "nvidia-cuda-cccl==13.2.* ; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.2.* ; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.2.* ; sys_platform == 'linux'",
    "nvidia-nvvm==13.2.* ; sys_platform == 'linux'",
    "pytest>=8.3",
]
# The Modal harness in cloud/: uv run --group cloud modal run -m cloud.app
cloud = [
    "modal>=1.6",
]

# torch's CUDA 13 wheels live on PyTorch's own index; everything else comes from PyPI. That
# index has no macOS wheels, so a Mac takes PyPI's CPU torch and runs the tests that need no GPU.
[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# mini_vllm_ext is the CUDA extension, built in place by src/extensions/build.py.
packages = ["src/mini_vllm", "src/extensions/mini_vllm_ext"]

[tool.hatch.build]
# An editable install puts both package roots on sys.path.
dev-mode-dirs = ["src", "src/extensions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: runs a CUDA kernel; build it first with uv run python src/extensions/build.py"]

[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # modern Python syntax
    "SIM",    # simplify code
    "RET",    # return statement consistency
    "RUF",    # Ruff-specific rules
]

# Wrapped "a b c".split() literals read better than the 300-character list
# SIM905 rewrites them into.
ignore = ["SIM905"]

# The error-norm docstrings spell ‖a − b‖ with a real minus sign, not a hyphen.
allowed-confusables = ["−"]

[tool.ruff.lint.per-file-ignores]
# The package exports its API after setting an environment variable torch reads at import.
"src/mini_vllm/__init__.py" = ["E402"]
# The extension package re-exports every kernel the compiled _ext module defines.
"src/extensions/mini_vllm_ext/__init__.py" = ["F403", "F405"]
# Kernel tests spell out tensor setup on one line each.
"tests/*" = ["E501"]
